name: Deploy Nouveau Site

on:
  push:
    branches: [main] 

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Recuperer le code du nouveau repo
        uses: actions/checkout@v4

      - name: 2. Envoyer les nouveaux fichiers vers Azure
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VM_IP }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "./*, !test" # Le "!" dit à GitHub : "N'envoie PAS le dossier test"
          target: "/var/www/html"

      - name: 3. Nettoyage et Redemarrage Nginx
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VM_IP }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # On s'assure que les droits sont bons pour le serveur web
            sudo chown -R www-data:www-data /var/www/html
            # On redémarre Nginx pour être sûr qu'il actualise tout
            sudo systemctl restart nginx
